<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Một lần bôi đen, đáp án thứ hai ở góc dưới trái và bỏ chọn để ẩn</title><desc id="desc">Hình minh họa hướng dẫn Gemini Study Helper; không phải ảnh chụp tài khoản.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5267d7"/></marker></defs><rect width="1100" height="660" rx="20" fill="#f1f5fc"/><g font-family="Arial, Helvetica, sans-serif"><rect x="34" y="30" width="48" height="48" rx="14" fill="#315bdc" stroke="none"/><text x="51" y="63" font-size="25" fill="white" font-weight="700">3</text><text x="101" y="62" font-size="32" fill="#162e44" font-weight="700">Bôi đen một lần → thả chuột → chờ</text><text x="36" y="112" font-size="20" fill="#53657c" font-weight="400">Đáp án là vị trí lựa chọn 1–4, tính từ trên xuống.</text><rect x="36" y="148" width="648" height="446" rx="16" fill="#fff" stroke="#d3deee"/><rect x="36" y="148" width="648" height="43" rx="0" fill="#e6edf7" stroke="none"/><text x="57" y="177" font-size="18" fill="#53657c" font-weight="400">Trang câu hỏi mẫu</text><rect x="64" y="216" width="565" height="251" rx="10" fill="#fff" stroke="#e1e7f1"/><rect x="82" y="235" width="296" height="35" rx="2" fill="#bfd8ff" stroke="none"/><text x="86" y="261" font-size="24" fill="#162e44" font-weight="400">2 + 2 bằng bao nhiêu?</text><rect x="82" y="281" width="61" height="35" rx="2" fill="#bfd8ff" stroke="none"/><text x="86" y="307" font-size="24" fill="#162e44" font-weight="400">A. 3</text><rect x="82" y="327" width="61" height="35" rx="2" fill="#bfd8ff" stroke="none"/><text x="86" y="353" font-size="24" fill="#162e44" font-weight="400">B. 4</text><rect x="82" y="373" width="61" height="35" rx="2" fill="#bfd8ff" stroke="none"/><text x="86" y="399" font-size="24" fill="#162e44" font-weight="400">C. 5</text><rect x="82" y="419" width="61" height="35" rx="2" fill="#bfd8ff" stroke="none"/><text x="86" y="445" font-size="24" fill="#162e44" font-weight="400">D. 6</text><text x="62" y="568" font-size="34" fill="#000" font-weight="700">2</text><rect x="716" y="148" width="348" height="446" rx="16" fill="#e7efff" stroke="none"/><text x="739" y="192" font-size="24" fill="#162e44" font-weight="700">Chọn đủ nội dung</text><text x="739" y="232" font-size="20" fill="#162e44" font-weight="400">Câu hỏi + cả 4 lựa chọn.</text><text x="739" y="277" font-size="21" fill="#162e44" font-weight="700">Thả chuột để tự gửi.</text><text x="739" y="321" font-size="20" fill="#162e44" font-weight="400">Giữ vùng chọn khi chờ.</text><text x="739" y="374" font-size="21" fill="#162e44" font-weight="700">Số 2 = lựa chọn thứ hai</text><text x="739" y="410" font-size="20" fill="#162e44" font-weight="400">Trong ví dụ này là B. 4.</text><text x="739" y="461" font-size="21" fill="#162e44" font-weight="700">Bỏ bôi đen → ẩn ngay.</text><text x="739" y="503" font-size="20" fill="#162e44" font-weight="400">Nếu bỏ chọn lúc đang chờ,</text><text x="739" y="534" font-size="20" fill="#162e44" font-weight="400">kết quả đến muộn bị bỏ qua.</text><line x1="679" y1="562" x2="105" y2="562" stroke="#5267d7" stroke-width="3" marker-end="url(#arrow)"/><text x="263" y="551" font-size="19" fill="#53657c" font-weight="400">Đáp án ở góc dưới trái</text><text x="36" y="636" font-size="14" fill="#61738a" font-weight="700">MINH HỌA THAO TÁC · GEMINI STUDY HELPER 0.5.1</text></g></svg>