<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Lưu API key và kiểm tra kết nối trong cài đặt extension</title><desc id="desc">Hình minh họa hướng dẫn Gemini Study Helper; không phải ảnh chụp tài khoản.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5267d7"/></marker></defs><rect width="1100" height="660" rx="20" fill="#f1f5fc"/><g font-family="Arial, Helvetica, sans-serif"><rect x="34" y="30" width="48" height="48" rx="14" fill="#315bdc" stroke="none"/><text x="51" y="63" font-size="25" fill="white" font-weight="700">2</text><text x="101" y="62" font-size="32" fill="#162e44" font-weight="700">Cấu hình dịch vụ AI</text><text x="36" y="112" font-size="20" fill="#53657c" font-weight="400">Mở cài đặt bằng biểu tượng extension trên thanh công cụ.</text><rect x="36" y="146" width="647" height="446" rx="16" fill="#fff" stroke="#d3deee"/><text x="60" y="186" font-size="25" fill="#162e44" font-weight="700">Gemini Study Helper · Cài đặt</text><text x="60" y="229" font-size="20" fill="#162e44" font-weight="700">Dịch vụ sử dụng</text><rect x="60" y="243" width="599" height="45" rx="8" fill="#f5f8fc" stroke="#d3deee"/><text x="75" y="273" font-size="21" fill="#162e44" font-weight="400">Tự động: Gemini → Groq khi hết quota ▾</text><text x="60" y="327" font-size="20" fill="#162e44" font-weight="700">Gemini API key</text><rect x="60" y="342" width="599" height="45" rx="8" fill="white" stroke="#b5c5dd"/><text x="75" y="372" font-size="20" fill="#718298" font-weight="400">Nhập khóa mới để lưu hoặc thay thế</text><text x="60" y="421" font-size="20" fill="#162e44" font-weight="700">ID model Gemini</text><rect x="60" y="436" width="599" height="44" rx="8" fill="#f5f8fc" stroke="#d3deee"/><text x="75" y="466" font-size="21" fill="#162e44" font-weight="400">gemini-3.5-flash-lite</text><rect x="60" y="508" width="319" height="53" rx="9" fill="#315bdc" stroke="none"/><text x="79" y="542" font-size="23" fill="white" font-weight="700">Lưu và kiểm tra Gemini</text><rect x="715" y="146" width="349" height="446" rx="16" fill="#e7efff" stroke="none"/><text x="739" y="189" font-size="24" fill="#162e44" font-weight="700">Dùng key của bạn</text><text x="739" y="234" font-size="20" fill="#162e44" font-weight="400">1. Nhập key vào cài đặt.</text><text x="739" y="278" font-size="20" fill="#162e44" font-weight="400">2. Lưu và kiểm tra kết nối.</text><text x="739" y="322" font-size="20" fill="#162e44" font-weight="400">3. Chờ thông báo kết quả.</text><text x="739" y="380" font-size="21" fill="#162e44" font-weight="700">Groq là tùy chọn.</text><text x="739" y="420" font-size="20" fill="#162e44" font-weight="400">Nhập key ở phần Groq,</text><text x="739" y="449" font-size="20" fill="#162e44" font-weight="400">rồi Lưu và kiểm tra Groq.</text><text x="739" y="502" font-size="20" fill="#162e44" font-weight="400">Nếu lỗi: xem thông báo</text><text x="739" y="531" font-size="20" fill="#162e44" font-weight="400">ngay trong cài đặt.</text><text x="36" y="636" font-size="14" fill="#61738a" font-weight="700">MINH HỌA THAO TÁC · GEMINI STUDY HELPER 0.5.1</text></g></svg>