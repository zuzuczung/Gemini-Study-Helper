<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc"><title id="title">Cài đặt extension từ GitHub trong Chrome</title><desc id="desc">Hình minh họa hướng dẫn Gemini Study Helper; không phải ảnh chụp tài khoản.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5267d7"/></marker></defs><rect width="1100" height="660" rx="20" fill="#f1f5fc"/><g font-family="Arial, Helvetica, sans-serif"><rect x="34" y="30" width="48" height="48" rx="14" fill="#315bdc" stroke="none"/><text x="51" y="63" font-size="25" fill="white" font-weight="700">1</text><text x="101" y="62" font-size="32" fill="#162e44" font-weight="700">Tải ZIP → giải nén → nạp vào Chrome</text><text x="36" y="112" font-size="20" fill="#53657c" font-weight="400">Chọn thư mục chứa manifest.json, không chọn file ZIP.</text><rect x="36" y="148" width="410" height="432" rx="16" fill="#fff" stroke="#d3deee"/><text x="60" y="189" font-size="23" fill="#162e44" font-weight="700">GitHub · Gemini-Study-Helper</text><rect x="60" y="216" width="148" height="44" rx="9" fill="#208347" stroke="none"/><text x="79" y="246" font-size="22" fill="white" font-weight="700">Code ▾</text><rect x="60" y="268" width="362" height="66" rx="10" fill="#edf3ff" stroke="none"/><text x="81" y="309" font-size="25" fill="#162e44" font-weight="700">Download ZIP</text><text x="60" y="381" font-size="23" fill="#162e44" font-weight="700">Giải nén file vừa tải</text><text x="60" y="422" font-size="20" fill="#162e44" font-weight="400">Gemini-Study-Helper-main/</text><text x="82" y="462" font-size="22" fill="#315bdc" font-weight="700">manifest.json</text><text x="82" y="500" font-size="20" fill="#53657c" font-weight="400">src/    options/    vendor/</text><line x1="459" y1="355" x2="492" y2="355" stroke="#5267d7" stroke-width="3" marker-end="url(#arrow)"/><rect x="510" y="148" width="554" height="432" rx="16" fill="#fff" stroke="#d3deee"/><text x="534" y="190" font-size="23" fill="#162e44" font-weight="700">chrome://extensions</text><text x="534" y="236" font-size="22" fill="#162e44" font-weight="400">Developer mode</text><rect x="958" y="212" width="76" height="34" rx="17" fill="#315bdc" stroke="none"/><rect x="1005" y="216" width="26" height="26" rx="13" fill="white" stroke="none"/><rect x="534" y="263" width="243" height="54" rx="10" fill="#edf3ff" stroke="#315bdc"/><text x="556" y="299" font-size="24" fill="#315bdc" font-weight="700">Load unpacked</text><line x1="655" y1="328" x2="655" y2="350" stroke="#5267d7" stroke-width="3" marker-end="url(#arrow)"/><rect x="534" y="366" width="506" height="113" rx="10" fill="#f5f8fc" stroke="#d3deee"/><text x="554" y="404" font-size="23" fill="#162e44" font-weight="700">Chọn thư mục đã giải nén</text><text x="554" y="444" font-size="21" fill="#162e44" font-weight="400">Bên trong phải có manifest.json</text><text x="534" y="530" font-size="21" fill="#53657c" font-weight="400">Đã cài? Reload → tải lại trang web.</text><text x="36" y="636" font-size="14" fill="#61738a" font-weight="700">MINH HỌA THAO TÁC · GEMINI STUDY HELPER 0.5.1</text></g></svg>